<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title><meta name="color-scheme" content="light dark"><style>
:root{--bg:#faf9f6;--fg:#222;--mut:#77756e;--line:#e4e2da;--acc:#2f6fed;--card:#fff;--fs:18px}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#e6e6e3;--mut:#9a9a94;--line:#33333a;--acc:#6b9bff;--card:#222226}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.7 Georgia,"Times New Roman",serif}
.tb{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font:13px system-ui,sans-serif}
.tb b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb button,.tb a{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none}.tb button:hover,.tb a:hover{border-color:var(--acc)}
.wrap{display:flex;gap:28px;justify-content:center;padding:24px 20px 80px}article{max-width:720px;flex:1;min-width:0}h1{font-size:1.6em;line-height:1.25;margin:0 0 6px}.meta{color:var(--mut);font:13px system-ui,sans-serif;margin-bottom:22px}
article h3{margin:1.4em 0 .4em;line-height:1.3}article p{margin:.7em 0}mark{background:#fde04788;color:inherit;border-radius:3px;padding:0 1px}.m{color:var(--mut);font-family:system-ui,sans-serif}
aside{width:270px;flex:none;font:13px system-ui,sans-serif;position:sticky;top:60px;align-self:flex-start;max-height:calc(100vh - 80px);overflow:auto}aside[hidden]{display:none}
.hl{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:8px}.hl small{display:block;color:var(--mut)}.hl button{float:right;border:0;background:none;cursor:pointer;color:var(--mut)}
#hb{position:fixed;z-index:9;display:none;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:6px 11px;font:600 13px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px #0005}
</style></head><body>
<div class="tb"><b id="ti">Reader</b><button id="fm" title="Smaller text">A−</button><button id="fp" title="Larger text">A+</button><button id="hp" title="Show or hide your highlights">🖍 <span id="hn">0</span></button><a id="og" target="_blank" rel="noopener" title="Open the original page in a normal tab">Original ↗</a></div>
<div class="wrap"><article id="a"><p class="m">Loading…</p></article><aside id="side" hidden></aside></div>
<button id="hb">🖍 Highlight</button><script src="reader.js"></script></body></html>
